name: Rust

# ============================================================================
# Rust Test Suite (cross-platform)
# ============================================================================
# `src-tauri/` carries the whole side-effect layer — process exec, filesystem,
# path resolution, the cc-switch SQLite DB and the three on-disk history
# formats. Almost all of it branches on the OS, so running its tests on Linux
# alone proves very little: `codex_home`'s env handling, path separators,
# windowless child processes and the winget/PowerShell command shapes only
# fail on the platform they target.
#
# This workflow is the counterpart to build-tauri.yml: that one proves the app
# *compiles* everywhere, this one proves it *behaves* everywhere.
#
# Works OUT-OF-THE-BOX without any secrets.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # Must exceed the build step's own budget, or the job kills the build before
    # the cache can be saved and every run starts cold again — which is how this
    # job spent five attempts never once getting past compilation on Linux. The
    # per-step budgets below are the real bounds; this is only a backstop.
    timeout-minutes: 60

    strategy:
      # One platform failing must not hide the others — the whole point is to
      # see which platforms disagree.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # src-tauri/rust-toolchain.toml pins the toolchain (1.95). rustup honours
      # that override per directory, so the components must be added from
      # src-tauri — adding them to the default `stable` would install them on
      # the wrong toolchain and `cargo fmt`/`clippy` would then fail to launch.
      - name: Add clippy to the pinned toolchain
        working-directory: src-tauri
        shell: bash
        run: |
          rustup show
          rustup component add clippy

      # `generate_context!` reads tauri.conf.json at compile time and refuses to
      # build when `frontendDist` (../out) is missing. The Rust tests never serve
      # a single asset, so a stub keeps this workflow from paying for a full
      # Next.js build on three platforms. build-tauri.yml still compiles against
      # the real export.
      - name: Stub the frontend dist
        shell: bash
        run: |
          mkdir -p out
          echo '<!doctype html><title>stub</title>' > out/index.html

      # No `cargo fmt --check` here on purpose — see src-tauri/rustfmt.toml.
      #
      # Runs everywhere: clippy sees a different tree per platform because of
      # #[cfg(...)], so a lint clean on Linux says nothing about Windows.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Building the tests is a separate step from running them, because the two
      # failure modes look identical from the outside and are not remotely the
      # same problem. `cargo clippy` only type-checks, so a warm clippy cache
      # says nothing about codegen: the first `cargo test` here has to compile
      # the whole tree — tauri, a bundled SQLite — for real. Splitting them means
      # a slow cold build can never again be mistaken for a hanging test.
      - name: cargo test (build)
        working-directory: src-tauri
        timeout-minutes: 40
        run: cargo test --all-features --no-run

      # ── The suite, one step per top-level module ────────────────────────────
      #
      # One `cargo test` would be shorter, and for a year that is what this was.
      # It cannot stay that way, because of how the Linux job fails: the runner
      # itself goes down mid-suite — "the hosted runner lost communication with
      # the server" — and GitHub archives **no log at all** for a job that ends
      # that way. Neither the `timeout` bound below nor the step's own
      # `timeout-minutes` can fire, because nothing is left alive to fire them.
      # A single step therefore leaves exactly one bit of evidence: "the tests
      # didn't finish". Which test took the machine down is unrecoverable.
      #
      # Step conclusions, unlike logs, are reported to the server as each step
      # ends — those survived every one of these deaths. So the suite is split
      # along module lines, and the step that never completed names the module.
      # Each `cargo test` re-uses the binary built above, so the split costs
      # seconds, not minutes.
      #
      # `ci-run-tests.sh` holds the bound and the serial-execution rationale;
      # keep this list in sync with the `mod` list in src/lib.rs.
      - name: cargo test — backup
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh backup

      - name: cargo test — ccswitch
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh ccswitch

      - name: cargo test — download
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh download

      - name: cargo test — exec
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh exec

      - name: cargo test — fsops
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh fsops

      - name: cargo test — history
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh history

      - name: cargo test — history_cache
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh history_cache

      - name: cargo test — login
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh login

      - name: cargo test — mcp
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh mcp

      - name: cargo test — net
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh net

      - name: cargo test — paths
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh paths

      - name: cargo test — skills
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 6
        run: ./ci-run-tests.sh skills

      # Belt and braces: if log archiving misbehaves again, the transcripts are
      # still retrievable as an artifact. One file per module now.
      - name: Upload test transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-${{ matrix.platform }}
          path: ${{ runner.temp }}/cargo-test-*.txt
          retention-days: 7
          if-no-files-found: ignore
