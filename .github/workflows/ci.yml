name: CI/CD Pipeline

# ============================================================================
# CI/CD Pipeline Orchestrator
# ============================================================================
# This is the main CI/CD pipeline that orchestrates smaller, modular workflows.
# Each workflow can also be run independently for better maintainability.
#
# Workflow Structure:
# ├── quality.yml     - Code quality & security checks (ESLint, TypeScript, audit)
# ├── test.yml        - Test suite with coverage & Next.js build
# ├── rust.yml        - cargo clippy + cargo test on Linux, Windows and macOS
# ├── e2e.yml         - Playwright specs against the web build
# ├── build-tauri.yml - Tauri desktop app builds (Windows, macOS, Linux)
# ├── deploy.yml      - Deployment workflows (optional, disabled by default)
# └── release.yml     - GitHub release creation (triggered by version tags)
#
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
# See CI_CD.md for detailed setup instructions for optional features.
# ============================================================================

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows can only request permissions up to those granted here.
# test.yml needs pull-requests + checks write to publish test result comments on PRs.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Step 1: Code Quality Checks
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  # Step 2: Test Suite & Build
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # Step 2b: Rust tests on all three platforms (runs alongside test.yml)
  rust:
    name: Rust
    uses: ./.github/workflows/rust.yml

  # Step 2c: Playwright against the web build. Runs on every push so the specs
  # can't rot unnoticed again.
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  # Step 3: Build Tauri Desktop Apps (after quality & test pass)
  build-tauri:
    name: Build Tauri
    needs: [quality, test, rust, e2e]
    uses: ./.github/workflows/build-tauri.yml
