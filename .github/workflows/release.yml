name: Release

# ============================================================================
# GitHub Release Creation
# ============================================================================
# Creates a GitHub release when a version tag is pushed.
# Triggers on tags matching v* (e.g., v1.0.0, v2.1.0-beta).
#
# This workflow:
# 1. Verifies the pushed tag matches the version in package.json,
#    Cargo.toml and tauri.conf.json (you MUST bump the version to release)
# 2. Runs quality checks and tests
# 3. Builds Tauri desktop applications for all platforms (Linux/Windows/macOS)
# 4. Publishes a GitHub release with all artifacts (auto-published, not draft)
# ============================================================================

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Reusable workflows can only request permissions up to those granted here.
# test.yml needs pull-requests + checks write; create-release needs contents write.
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  # Gate: a release can only happen when the version was actually bumped.
  # The pushed tag (e.g. v0.2.0 -> 0.2.0) must match the version declared in
  # package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json. If they
  # disagree the whole release fails before anything is built or published.
  verify-version:
    name: Verify Version Bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag matches package versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"

          echo "tag             : $TAG"
          echo "package.json    : $PKG"
          echo "tauri.conf.json : $TAURI"
          echo "Cargo.toml      : $CARGO"

          fail=0
          if [ "$TAG" != "$PKG" ];   then echo "::error::tag ($TAG) != package.json ($PKG)"; fail=1; fi
          if [ "$TAG" != "$TAURI" ]; then echo "::error::tag ($TAG) != tauri.conf.json ($TAURI)"; fail=1; fi
          if [ "$TAG" != "$CARGO" ]; then echo "::error::tag ($TAG) != Cargo.toml ($CARGO)"; fail=1; fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Version mismatch — bump all three version files to match the tag before releasing."
            exit 1
          fi
          echo "All versions match $TAG ✅"

  # Run quality checks first
  quality:
    name: Quality Check
    needs: verify-version
    uses: ./.github/workflows/quality.yml

  # Run tests
  test:
    name: Test Suite
    needs: verify-version
    uses: ./.github/workflows/test.yml

  # Rust tests on Linux/Windows/macOS — a release must never ship a side-effect
  # layer that was only ever exercised on one OS.
  rust:
    name: Rust Suite
    needs: verify-version
    uses: ./.github/workflows/rust.yml

  # Build every platform and publish the GitHub release via the official
  # tauri-action. With the signing secrets set and createUpdaterArtifacts enabled
  # (via --config, so unsigned CI in build-tauri.yml stays green), each matrix job
  # uploads its installers + `.sig` to the tag; tauri-action merges the platform
  # signatures into a single `latest.json` served at
  # `releases/latest/download/latest.json` (the updater endpoint).
  release:
    name: Release (${{ matrix.target }})
    needs: [verify-version, quality, test, rust]
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # src-tauri/rust-toolchain.toml pins the toolchain, and `tauri build` runs
      # cargo from src-tauri, so the release target must be added to THAT
      # toolchain — not the default `stable` that dtolnay/rust-toolchain set up.
      # Matters for cross builds (e.g. Intel macOS on an Apple-Silicon runner);
      # a no-op when the matrix target is the runner's own host target.
      - name: Add the release target to the pinned toolchain
        working-directory: src-tauri
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Ships installers + the signed updater artifacts. `createUpdaterArtifacts`
      # is enabled here via --config (NOT in tauri.conf.json) so the unsigned
      # validation build in build-tauri.yml and local `pnpm tauri build` keep
      # working without a signing key. See src-tauri/UPDATER.md.
      - name: Build & publish release (installers + updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: agentpack ${{ github.ref_name }}
          # Every platform job merges its signature into one latest.json, which
          # plugins.updater.endpoints points at.
          includeUpdaterJson: true
          releaseBody: |
            ## 安装 / Install

            从下面的 **Assets** 里选你的平台：macOS `.dmg`、Windows `.msi` 或 `.exe`、Linux `.AppImage` 或 `.deb`。

            Pick your platform from **Assets** below: macOS `.dmg`, Windows `.msi` / `.exe`, Linux `.AppImage` / `.deb`.

            ### ⚠️ macOS 提示「已损坏，无法打开」

            这个版本还没有经过 Apple 公证（$99/年），macOS 会拦下所有未公证的下载。**app 本身没有损坏**。把它拖进「应用程序」后，执行一次：

            ```bash
            xattr -dr com.apple.quarantine /Applications/agentpack.app
            ```

            > This build is not notarized yet, so macOS blocks it with a misleading
            > "damaged" message. Move the app to /Applications and run the command
            > above once.

            ### ⚠️ Windows 提示 SmartScreen

            点「更多信息」→「仍要运行」。/ Click **More info** → **Run anyway**.

            ---

            装好之后，应用内的「关于」页可以直接检查并安装后续更新，不用再手动下载。
          releaseDraft: false
          # Tags containing a hyphen (e.g. v1.0.0-beta) are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: '--target ${{ matrix.target }} --config {"bundle":{"createUpdaterArtifacts":true}}'
