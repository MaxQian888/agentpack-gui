[package]
name = "agentpack-gui"
version = "0.2.3"
description = "agentpack — desktop installer for Claude Code, Codex, engineering skills, MCP servers, network/mirrors and cc-switch"
authors = ["Arxtect"]
license = "MIT"
repository = "https://github.com/Arxtect/agentpack-gui"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
