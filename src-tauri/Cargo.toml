[package]
name = "agentpack-gui"
version = "0.15.0"
description = "agentpack — desktop installer for Claude Code, Codex, engineering skills, MCP servers, network/mirrors and cc-switch"
authors = ["Arxtect"]
license = "MIT"
repository = "https://github.com/Arxtect/agentpack-gui"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
# GitHub direct skill install: fetch a repo tarball (rustls; no default features so
# responses are never transparently gunzipped — GzDecoder handles the .tar.gz) and
# unpack it (tar's `unpack` refuses entries escaping the destination).
#
# `socks-proxy` matters: without it `ureq::Proxy::new` rejects every socks:// URL,
# so `net::proxy_from_env` silently returned None and our own downloads (skill
# tarballs, release assets) went DIRECT on a machine whose only route out is a
# SOCKS proxy — i.e. they failed for exactly the users who needed the proxy most.
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"] }
flate2 = "1"
tar = "0.4"
# Content hashing for skill update detection (see skills::hash_skill_dir).
sha2 = "0.11"
url = "2"
glob = "0.3"
rustls-pemfile = "2"
webpki-roots = "1"
# Management credentials are isolated from model keys and files. 3.6.3 has
# MSRV 1.75, which stays below this crate's pinned Rust 1.77.2 toolchain.
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# Desktop-only plugins. `single-instance` keeps a second launch from racing the
# first one's writes to ~/.claude, ~/.codex & the cc-switch DB; `global-shortcut`
# backs the opt-in hotkey that re-summons the window. Neither exists on mobile,
# hence the target gate (the same one the plugins' own docs use).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

# `kill(2)` with a negative pid, to signal a whole process group. Shelling out to
# `kill -9 -<pgid>` looked equivalent and is not: BSD `kill` (macOS) reads the
# negative argument as a process group, procps `kill` (Linux) reads it as a
# second signal specification and fails, so every timeout and every cancel was a
# silent no-op on Linux. See exec::kill_tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the live persisted PATH from the registry so tools installed mid-session
# (Node via winget, claude via `npm i -g`) are found without an app restart.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
